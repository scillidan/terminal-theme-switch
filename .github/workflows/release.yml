name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(git describe --tags --abbrev=0)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG="terminal-theme-switch-$VERSION"
          mkdir -p "dist/$PKG"
          cp terminal-theme-switch.py "dist/$PKG/"
          cp -R bin integrations "dist/$PKG/"
          cp LICENSE README.md "dist/$PKG/"
          chmod +x "dist/$PKG/bin/"*
          cd dist
          zip -r "$PKG.zip" "$PKG/"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: terminal-theme-switch
          path: dist/*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            dist/terminal-theme-switch-${VERSION}.zip \
            --title "$VERSION" \
            --generate-notes
